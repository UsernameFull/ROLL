defaults:
  - ../config/deepscaler_zero
  - ../config/deepscaler_lr_scheduler
  - ../config/deepscaler_dataset
  - ../config/deepscaler_tool
  - ../config/deepscaler_template
  - _self_

hydra:
  searchpath:
    - file://examples

exp_name: "qwen3-30BA3B-rlvr-megatron-fp8-from-mxfp8"
seed: 42
logging_dir: ./output/logs
output_dir: ./output
render_save_dir: ./output/render
system_envs:
  USE_MODELSCOPE: '1'
  VLLM_USE_V1: '1'
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  # Set ROLL_ASCEND_MXFP8_STATE_DICT_LOADER externally if your MindSpeed build
  # does not expose a supported trainable MXFP8 state-dict loader.
  ROLL_MAX_CONCURRENT_TASKS: '32'
  ASCEND_RT_VISIBLE_DEVICES: '0,1,2,3,4,5,6,7'
  TOKENIZERS_PARALLELISM: 'true'
track_with: tensorboard
tracker_kwargs:
  api_key:
  project: roll_exp
  notes: "ascend native mxfp8 rlvr from pre-quantized ModelSlim checkpoint"
  tags:
    - rlvr
    - ascend
    - mxfp8
    - megatron

num_gpus_per_node: 8
pretrain: /path/to/Qwen3-30B-A3B-ModelSlim-MXFP8
reward_pretrain: Qwen/Qwen3-30B-A3B

sequence_length: 6144
max_prompt_length: 2048
max_response_length: 4096
rollout_batch_size: 256
val_batch_size: 512
prompt_length: 2048
response_length: 4096

ppo_epochs: 1
adv_estimator: "grpo"

init_kl_coef: 0.0
whiten_advantages: true
advantage_clip: 20.0
dual_clip_loss: true
loss_agg_mode: "seq-mean-token-mean"

use_liger_kernel: false

actor_train:
  model_args:
    model_name_or_path: ${pretrain}
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 5.0e-7
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 256
    warmup_steps: 20
    num_train_epochs: 100
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: 1
      use_distributed_optimizer: true
      recompute_granularity: full
      recompute_method: uniform
      recompute_num_layers: 1
      transformer_impl: transformer_engine
      fp8: e4m3
      fp8_format: e4m3
      fp8_recipe: mxfp8
      fp8_param: true
      quantized_checkpoint_format: ascend_mxfp8
      use_flash_attn: true
      moe_router_dtype: fp32
  device_mapping: list(range(0,8))
  infer_batch_size: 1
  use_sequence_packing: false
  use_remove_padding: false
  max_grad_norm: 1.0

actor_infer:
  model_args:
    model_name_or_path: ${pretrain}
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 16
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.8
      block_size: 16
      max_model_len: 6144
      tensor_parallel_size: 2
      enforce_eager: false
      quantization: ascend
      load_format: auto
  device_mapping: list(range(0,8))
  infer_batch_size: 128

reference:
  model_args:
    model_name_or_path: Qwen/Qwen3-30B-A3B
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_infer
    strategy_config:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: 1
  device_mapping: list(range(0,8))
  infer_batch_size: 2

rewards:
  math_rule:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: ${reward_pretrain}
      disable_gradient_checkpointing: true
      dtype: bf16
    data_args:
      template: qwen3
    strategy_args:
      strategy_name: hf_infer
      strategy_config: {}
    device_mapping: list(range(0,8))
    infer_batch_size: 1

custom_envs:
  deepscaler:
    env_type: deepscaler
    max_env_num_per_worker: 32
    max_env_step: 1
    env_config: {}
    group_name: deepscaler
    tags: [SimpleSokoban]
