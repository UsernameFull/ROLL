name: MindSpeed NPU Tests

on:
  workflow_dispatch:
    inputs:
      mindspeed_repo:
        description: "MindSpeed git repository"
        required: false
        default: "https://github.com/ascend/MindSpeed.git"
      mindspeed_ref:
        description: "MindSpeed branch, tag, or ref to install"
        required: false
        default: "core_r0.16.0"
  push:
    branches: [main, npu_mindspeed_ci]
    paths:
      - ".github/workflows/ci-npu-mindspeed.yml"
      - "mcore_adapter/**"
      - "roll/third_party/megatron/**"
      - "tests/third_party/megatron/**"
      - "requirements_common.txt"
      - "requirements_vision.txt"
      - "setup.py"
      - "pyproject.toml"
  pull_request:
    branches: [main, npu_mindspeed_ci]
    paths:
      - ".github/workflows/ci-npu-mindspeed.yml"
      - "mcore_adapter/**"
      - "roll/third_party/megatron/**"
      - "tests/third_party/megatron/**"
      - "requirements_common.txt"
      - "requirements_vision.txt"
      - "setup.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mindspeed-npu-test:
    name: MindSpeed 0.16 Core NPU Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: linux-aarch64-a3-8
    timeout-minutes: 90
    container:
      image: quay.io/ascend/vllm-ascend:v0.18.0-a3
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
      PIP_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
      PIP_TRUSTED_HOST: repo.huaweicloud.com
      HF_ENDPOINT: https://hf-mirror.com
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      TASK_QUEUE_ENABLE: "2"
      VLLM_USE_V1: "1"
      VLLM_ASCEND_ENABLE_FLASHCOMM: "0"
      VLLM_ASCEND_ENABLE_NZ: "0"
      MINDSPEED_REPO: ${{ github.event.inputs.mindspeed_repo || 'https://github.com/ascend/MindSpeed.git' }}
      MINDSPEED_REF: ${{ github.event.inputs.mindspeed_ref || 'core_r0.16.0' }}
      MINDSPEED_CACHE_KEY: "core-r0.16.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache NPU pip packages
        uses: actions/cache@v4
        with:
          path: .pip-cache
          key: ${{ runner.os }}-npu-mindspeed-${{ env.MINDSPEED_CACHE_KEY }}-${{ hashFiles('requirements_common.txt', 'requirements_vision.txt', 'mcore_adapter/pyproject.toml', 'mcore_adapter/requirements.txt', 'setup.py', 'pyproject.toml', '.github/workflows/ci-npu-mindspeed.yml') }}
          restore-keys: |
            ${{ runner.os }}-npu-mindspeed-${{ env.MINDSPEED_CACHE_KEY }}-
            ${{ runner.os }}-npu-mindspeed-
            ${{ runner.os }}-npu-pip-

      - name: Configure pip cache
        run: |
          mkdir -p "$PIP_CACHE_DIR"
          python3 -m pip cache dir

      - name: Configure Ascend runtime
        shell: bash
        run: |
          set -eo pipefail
          if [ -f /usr/local/Ascend/ascend-toolkit/set_env.sh ]; then
            source /usr/local/Ascend/ascend-toolkit/set_env.sh
          fi
          if [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then
            source /usr/local/Ascend/nnal/atb/set_env.sh
          fi

          export ASCEND_HOME_PATH="${ASCEND_HOME_PATH:-/usr/local/Ascend/ascend-toolkit/latest}"
          export ASCEND_TOOLKIT_HOME="${ASCEND_TOOLKIT_HOME:-${ASCEND_HOME_PATH}}"
          export ASCEND_OPP_PATH="${ASCEND_OPP_PATH:-${ASCEND_HOME_PATH}/opp}"
          export ASCEND_AICPU_PATH="${ASCEND_AICPU_PATH:-${ASCEND_HOME_PATH}}"
          export LD_LIBRARY_PATH="/usr/local/Ascend/ascend-toolkit/latest/lib64:/usr/local/Ascend/ascend-toolkit/latest/runtime/lib64:/usr/local/Ascend/ascend-toolkit/latest/runtime/lib64/stub:/usr/local/Ascend/ascend-toolkit/latest/tools/hccl/lib64:/usr/local/Ascend/ascend-toolkit/latest/hccl/lib64:${LD_LIBRARY_PATH:-}"

          cann_python_paths=()
          for path in \
            "${ASCEND_HOME_PATH}/python/site-packages" \
            "${ASCEND_HOME_PATH}/opp/built-in/op_impl/ai_core/tbe"; do
            if [ -d "$path" ]; then
              cann_python_paths+=("$path")
            fi
          done
          if [ ${#cann_python_paths[@]} -gt 0 ]; then
            export PYTHONPATH="$(IFS=:; echo "${cann_python_paths[*]}"):${PYTHONPATH:-}"
          fi

          echo "ASCEND_HOME_PATH=${ASCEND_HOME_PATH}" >> "$GITHUB_ENV"
          echo "ASCEND_TOOLKIT_HOME=${ASCEND_TOOLKIT_HOME}" >> "$GITHUB_ENV"
          echo "ASCEND_OPP_PATH=${ASCEND_OPP_PATH}" >> "$GITHUB_ENV"
          echo "ASCEND_AICPU_PATH=${ASCEND_AICPU_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PYTHONPATH=${PYTHONPATH:-}" >> "$GITHUB_ENV"
          echo "${ASCEND_HOME_PATH}/bin" >> "$GITHUB_PATH"
          echo "${ASCEND_HOME_PATH}/compiler/ccec_compiler/bin" >> "$GITHUB_PATH"

      - name: Show environment info
        run: |
          python3 - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import sys

          import torch
          import torch_npu

          def module_available(name):
              return importlib.util.find_spec(name) is not None

          print(f"python={sys.version.split()[0]}")
          print(f"pip={metadata.version('pip')}")
          print(f"torch={torch.__version__}")
          print(f"torch_npu={torch_npu.__version__}")

          if not module_available("tbe"):
              raise RuntimeError("CANN tbe Python module is not visible in PYTHONPATH")
          if not torch.npu.is_available():
              raise RuntimeError("torch.npu.is_available() is False")
          print(f"npu_device_count={torch.npu.device_count()}")
          PY
          npu-smi info

      - name: Install ROLL requirements
        run: |
          python3 -m pip install --upgrade pip wheel
          # torchair still imports pkg_resources; setuptools 82 removed it.
          python3 -m pip install "setuptools<82"
          python3 -m pip install pytest-timeout
          python3 -m pip install -r requirements_common.txt
          python3 -m pip install deepspeed==0.16.4 tensorboard
          python3 -m pip install "setuptools<82"
          python3 -c "import pkg_resources; print('pkg_resources=available')"

      - name: Install MindSpeed core_r0.16.0
        shell: bash
        run: |
          set -eo pipefail
          export MINDSPEED_SRC="/tmp/MindSpeed"
          rm -rf "${MINDSPEED_SRC}"
          git clone --depth 1 --branch "${MINDSPEED_REF}" "${MINDSPEED_REPO}" "${MINDSPEED_SRC}"
          cd "${MINDSPEED_SRC}"
          git log -1 --oneline
          python3 -m pip install --no-build-isolation --no-deps -e .

      - name: Install ROLL
        run: |
          python3 -m pip install -e .

      - name: Prepare Megatron test model
        shell: bash
        run: |
          set -eo pipefail
          local_model="/data/cpfs_0/common/models/Qwen2.5-0.5B-Instruct"
          if [ -d "${local_model}" ]; then
            echo "ROLL_MEGATRON_TEST_MODEL=${local_model}"
            echo "ROLL_MEGATRON_TEST_MODEL=${local_model}" >> "${GITHUB_ENV}"
            exit 0
          fi

          python3 - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          model_path = snapshot_download("Qwen/Qwen2.5-0.5B-Instruct")
          print(f"ROLL_MEGATRON_TEST_MODEL={model_path}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ROLL_MEGATRON_TEST_MODEL={model_path}\n")
          PY

      - name: Show MindSpeed and vLLM Ascend info
        run: |
          python3 - <<'PY'
          import importlib.metadata as metadata

          import mindspeed
          import mindspeed.megatron_adaptor
          import torch
          import vllm
          from roll.platforms import current_platform

          def package_version(name):
              try:
                  return metadata.version(name)
              except metadata.PackageNotFoundError:
                  return "not installed"

          packages = (
              "mindspeed",
              "megatron-core",
              "vllm-ascend",
              "torch",
              "torch-npu",
              "transformers",
              "deepspeed",
          )
          for package_name in packages:
              print(f"{package_name}={package_version(package_name)}")

          print(f"mindspeed_path={mindspeed.__path__}")
          print(f"vllm={vllm.__version__}")
          print(f"platform={current_platform.device_type}")
          print(f"npu_device_count={torch.npu.device_count()}")
          PY

      - name: Run MindSpeed Megatron offload tests
        shell: bash
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:${PYTHONPATH:-}"
          set +e
          torchrun --standalone --nnodes=1 --nproc-per-node=2 -m pytest -s -vv --tb=short tests/third_party/megatron/test_offload_states.py 2>&1 | tee npu_mindspeed_pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path

          log_path = Path("npu_mindspeed_pytest.log")
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          tail = "\n".join(lines[-160:])
          tail = tail[-8000:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=MindSpeed pytest failure tail::{escaped}")
          PY
            exit "${status}"
          fi
        env:
          ROLL_NPU_CI: "1"
